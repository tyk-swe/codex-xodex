# Manual reference. Guided first-run setup asks for your repositories.
# Omitted paths are relative to this file's directory:
# state/, tasks/, run/engine.sock, run/mcp.sock, secrets/github-token.
# Explicit absolute paths (including ${HOME} and ~ expansion) take precedence.
image = "localhost/chatgpt-xodex-worker:0.1.0"

# Replace this placeholder with a repository you own or are authorized to use.
[repositories."your-owner/your-repo"]
branch_prefix = "xodex/"
checks = []
# Empty owner checks require task-supplied checks under the finalization rules.
network = "none"
# To explicitly allow outbound networking:
# network = "slirp4netns:allow_host_loopback=false"
