config_version: 1
control_plane:
  base_url: https://api.openai.com
  tunnel_id: @TUNNEL_ID@
  api_key: env:CONTROL_PLANE_API_KEY
mcp:
  server_urls:
    - channel: main
      url: http://localhost/mcp
      unix_socket: env:MCP_UNIX_SOCKET_PATH
  max_concurrent_requests: 8
  startup_wait_timeout: 60s
health:
  listen_addr: 127.0.0.1:0
log:
  level: info
  format: json
